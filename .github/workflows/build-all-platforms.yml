name: Build All Platforms (Windows/macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.3)"
        required: true
        default: "1.3"
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Build Windows (EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build EXE with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "LetaTakip_v${{ github.event.inputs.version || '1.3' }}"
          --add-data "script/assets;assets"
          --collect-all ttkbootstrap
          --collect-all tkcalendar
          --collect-all babel
          --collect-all reportlab
          script/main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          retention-days: 30

  macos:
    name: Build macOS (APP + DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build APP with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed
          --name "LetaTakip"
          --add-data "script/assets:assets"
          --collect-all ttkbootstrap
          --collect-all tkcalendar
          --collect-all babel
          --collect-all reportlab
          script/main.py

      - name: Build DMG
        run: |
          VERSION="${{ github.event.inputs.version || '1.3' }}"
          hdiutil create -volname "LetaTakip_v${VERSION}" -srcfolder dist/LetaTakip.app -ov -format UDZO "dist/LetaTakip_v${VERSION}.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/LetaTakip.app
            dist/*.dmg
          retention-days: 30

  create-release:
    name: Create Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows/*
            macos/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
